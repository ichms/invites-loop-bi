# Warehouse connection for dbt. dbt-postgres cannot consume a libpq URI or
# `service=` string, so the connection is split into fields; `setup_env.sh`
# exports the DBT_PG_* values for local development (and sets DBT_PROFILES_DIR
# to this directory). No credential ever lives in this file.
invites_loop_bi:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME', 'invites_dw') }}"
      sslmode: "{{ env_var('DBT_PG_SSLMODE', 'require') }}"
      schema: staging
      threads: 4
