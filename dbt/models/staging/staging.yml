# Tests for the staging layer. Two families recur:
#   - grain tests (D-04): unique_combination_of_columns on the declared grain,
#     never cut;
#   - D-05 pairs on JSONB-extracted fields: not_null where the field is
#     structurally required, null_rate_below where a measured baseline of nulls
#     is legitimate — the threshold catches the key-rename-flatlines-the-
#     dashboard failure mode, which not_null alone cannot on a nullable field.

version: 2

models:
  - name: stg_sibc__user_intg_log
    description: >
      Integrated-analysis log, deduped to (user_id, ymd_date) by last
      created_at (Q-01). LLM error rows filtered out. JSONB flattened through
      the allow-list seed only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date]
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: ymd_date
        description: Cast from varchar 'YYYYMMDD'; not_null is the cast-integrity test (source ymd is never null).
        data_tests: [not_null]
      - name: risk_overview
        data_tests: [not_null]
      - name: signature_description
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.10}
      - name: signature_disease_type_code
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.10}
      - name: signature_lifestyle_type_code
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.10}
      - name: signature_potential_type_code
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.10}
      - name: signature_segment_type_code
        description: Absent on ~5% of payloads (measured 2026-08-06); threshold leaves room for noise, not for a rename.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.25}

  - name: stg_sibc__user_irs_log
    description: IRS-analysis log, same dedupe rule as the intg log (paired writes).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date]
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: ymd_date
        data_tests: [not_null]
      - name: risk_overview
        data_tests: [not_null]

  - name: stg_sibc__user_master
    description: >
      Cohort population (N-02), one row per enrolled user. Identity and
      static-age columns are never selected. weight_kg / height_cm are the
      enrolment snapshot for dim_user segment moderation (Frame 2); zeros
      nullified.
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: ['M', 'F']
              config: {severity: warn}
      - name: joined_dt
        data_tests: [not_null]
      - name: weight_kg
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.02}
      - name: height_cm
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.02}

  - name: stg_irs__user_irs_hist
    description: Scalar IRS+/LRS/MRS/PRS scores, relational — the source of truth the sibc payloads only rank.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, score_date, disease_id]
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: score_date
        data_tests: [not_null]
      - name: disease_id
        data_tests: [not_null]
      # Measured null rates 2026-08-06: irs 18.7%, irsp/lrs 18.4%, mrs 19.0%,
      # prs 22.8%. A breach of 0.35 means the extraction/loading path broke,
      # not that scoring got a little sparser.
      - name: irs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: irsp_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: lrs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: mrs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: prs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}

  - name: stg_iccoli__tb_ext_user_mapper
    description: Loop-cohort side of the Q-10 mapper; user_no never leaves staging.
    columns:
      - name: user_id
        data_tests: [not_null, unique]

  - name: stg_iccoli__tb_user_personal_info
    description: birth reduced to birth_year (D-23); raw birth never selected.
    columns:
      - name: user_id
        description: Translated key; a null here means an extracted row has no LOOP mapping (join-hygiene tripwire).
        data_tests: [not_null]
      - name: birth_year
        description: 2 of 441 source rows have no birth value (measured 2026-08-06).
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.05}
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1900
                max_value: 2030
              config:
                where: "birth_year is not null"

  - name: stg_iccoli__tb_user_info
    columns:
      - name: user_id
        data_tests: [not_null, unique]

  - name: stg_iccoli__tb_action_info
    columns:
      - name: action_no
        data_tests: [not_null, unique]

  - name: stg_iccoli__tb_action_user_log
    columns:
      - name: action_log_no
        data_tests: [not_null, unique]
      - name: user_id
        data_tests: [not_null]
      - name: action_no
        data_tests: [not_null]

  - name: stg_iccoli__tb_user_login_log
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: login_datetime
        data_tests: [not_null]

  - name: stg_ichms__deployment_site
    description: >
      Owner-approved deployment sites from auth_customer. Only the Ulsan and
      Jeju customer UUIDs qualify; application tenants are excluded.
    columns:
      - name: site_id
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - '2e0a3387-7058-4f9e-a134-2017f7b7000b'
                  - '778d4ff7-ab76-4070-a9a9-716fac93d9c9'
      - name: site_name_kor
        data_tests: [not_null]
      - name: site_name_eng
        data_tests: [not_null]
      - name: is_active
        data_tests:
          - accepted_values:
              arguments: {values: [true]}

  - name: stg_ichms__current_user_deployment_site
    description: >
      One active Ulsan/Jeju link per user under the current iCHMS write
      contract. Current-state only; in-place updates do not preserve history.
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ichms__deployment_site')
                field: site_id
      - name: user_customer_id
        data_tests: [not_null, unique]

  # The two lifelog models below back the behavioural half of fct_user_day.
  # The older stg_discovery__* models carry no declarations; these do, because
  # their grain is what keeps fct_user_day's grain true.
  - name: stg_discovery__lifelog_meal
    description: >
      Surviving meal records (is_deleted filtered out), joined to a user through
      stg_discovery__lifelog_user_info. This is the channel the evidence
      dashboard reported as disc_lifelog_user_food — 11 users — while the real
      one carries 335 users and ~36.5k records (C22 / §5).
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: recorded_date
        data_tests: [not_null]

  - name: stg_discovery__lifelog_wearable_day
    description: >
      One row per (user, day, stream) a wearable stream fired. The union of all
      five streams is the settled definition of device ownership (C3), after
      three competing definitions produced 130 / 157 / 167 and were quoted
      interchangeably. Materialized as a table — heartrate alone is ~8.5M rows.
      Also carries per-stream daily aggregates (n_samples, value_*, kcal, duration)
      for fct_wearable_day; fct_user_day still only counts distinct stream_code.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, wear_date, stream_code]
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: wear_date
        data_tests: [not_null]
      - name: stream_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [step, activity, heartrate, oxygen_saturation, sleep]
      - name: n_samples
        data_tests: [not_null]

  - name: stg_discovery__lifelog_wearable_step
    description: Distinct raw step payloads; exact duplicates collapse into source_row_count.
    columns:
      - name: source_observation_id
        data_tests: [not_null, unique]
      - name: user_lifelog_sn
        data_tests: [not_null]
      - name: measured_at
        data_tests: [not_null]
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: stg_discovery__lifelog_wearable_activity
    description: Distinct raw activity interval payloads; exact duplicates collapse into source_row_count.
    columns:
      - name: source_observation_id
        data_tests: [not_null, unique]
      - name: user_lifelog_sn
        data_tests: [not_null]
      - name: measured_at
        data_tests: [not_null]
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: stg_discovery__lifelog_wearable_heartrate
    description: >
      Distinct raw heart-rate payloads. The measured_at/type/value combination
      remains distinct; only identical payloads collapse into source_row_count.
    columns:
      - name: source_observation_id
        data_tests: [not_null, unique]
      - name: user_lifelog_sn
        data_tests: [not_null]
      - name: measured_at
        data_tests: [not_null]
      - name: heartrate_count
        data_tests: [not_null]
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: stg_discovery__lifelog_wearable_oxygen_saturation
    description: Distinct raw SpO2 payloads; exact duplicates collapse into source_row_count.
    columns:
      - name: source_observation_id
        data_tests: [not_null, unique]
      - name: user_lifelog_sn
        data_tests: [not_null]
      - name: measured_at
        data_tests: [not_null]
      - name: oxygen_saturation
        data_tests: [not_null]
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: stg_discovery__lifelog_wearable_sleep
    description: Distinct raw sleep-session payloads; exact duplicates collapse into source_row_count.
    columns:
      - name: source_observation_id
        data_tests: [not_null, unique]
      - name: user_sleep_sn
        description: >
          Source session key. Unique today and required for unambiguous
          sleep-stage attribution; a second payload for one key fails loudly.
        data_tests: [not_null, unique]
      - name: user_lifelog_sn
        data_tests: [not_null]
      - name: started_at
        data_tests: [not_null]
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: stg_discovery__lifelog_wearable_sleep_stage
    description: >
      Distinct raw sleep-stage interval payloads. Attribution to a user runs
      through stg_discovery__lifelog_wearable_sleep.
    columns:
      - name: source_observation_id
        data_tests: [not_null, unique]
      - name: user_sleep_sn
        data_tests: [not_null]
      - name: started_at
        data_tests: [not_null]
      - name: sleep_stage_code
        data_tests: [not_null]
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
