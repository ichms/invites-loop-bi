# stg_ichms: EL landing schema for the iCHMS auth/member layer (database
# invites_loop, schema ichms). The Q-11 inventory (PII_INVENTORY.md) found the
# direct identifiers this layer carried (credentials, phone numbers, names,
# birth dates, login IPs, chart number); they were dropped and excluded at
# extraction on 2026-08-06. Since 2026-08-13, auth_customer and
# auth_user_customer feed the owner-approved current Ulsan/Jeju site dimension;
# the remaining auth/member tables still feed no mart.

version: 2

sources:
  - name: stg_ichms
    description: iCHMS auth/member layer, landed by the ichms ELT DAG.
    schema: stg_ichms
    loaded_at_field: _loaded_at
    tables:
      - name: com_code
        description: Full-refresh target — freshness on it measures whether the ichms DAG ran at all.
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: auth_client
      - name: auth_customer
        description: >
          Mixes deployment sites with application tenants. Only the two
          owner-approved UUIDs may enter dim_deployment_site.
      - name: auth_user
      - name: auth_user_account
      - name: auth_user_customer
        description: >
          User/customer links. Full-refreshed because in-place customer changes
          do not update linked_dt; current-site reporting uses active links only.
      - name: auth_user_login_history
      - name: auth_user_profile
      - name: auth_user_withdraw_history
      - name: cnet_event_info_transmit_history
      - name: cnet_push_info_transmit_history
      - name: com_code_language_map
      - name: cudc_workflow_history
      - name: mem_family
      - name: mem_family_msg
      - name: mem_user
