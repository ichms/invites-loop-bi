# Tests for the marts layer. The grain test on each fact is the contract that
# makes the rest survivable (D-04) — it is the one thing the cut order never
# touches. Relationship tests are the second half: they turn "this fact row has
# no dimension row" from a silently-dropped chart row into a build failure.

version: 2

models:
  - name: dim_user
    description: >
      SCD1 user dimension. Population = the sibc cohort (N-02), 404 rows.
      is_mapped flags cohort members with no iccoli link so they keep their
      facts instead of being orphaned. No name, no DOB, no static age.
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: site_id
        description: >-
          NOT A REAL AFFILIATION — a hardcoded constant, identical for all 404 users.
          Do not group, filter or segment by it; it tells you nothing. Real per-user site
          links exist in stg_ichms.auth_user_customer (all 404 resolve to ULSAN) but are
          deliberately not read here, because affiliation is many-to-many — one person can
          be in Ulsan and also in Jeju — and a single column cannot hold that. See CLAUDE.md
          "Site affiliation is multi-valued".
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_deployment_site')
                field: site_id
      - name: birth_year
        description: Null for 4 of 404 users (measured 2026-08-06); age columns in the facts go null with it rather than guessing.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.05}
      - name: is_mapped
        data_tests: [not_null]

  - name: dim_date
    description: Generated calendar, 2025-01-01 through the end of next year. Weeks start Monday (D-18).
    columns:
      - name: date_day
        data_tests: [not_null, unique]
      - name: week_start_date
        data_tests: [not_null]

  - name: dim_disease
    description: The 35 user-facing diseases with Korean + English labels. The 9 scored-but-not-displayed ids are deliberately absent.
    columns:
      - name: disease_id
        data_tests: [not_null, unique]
      - name: phenotype_kor
        data_tests: [not_null]

  - name: dim_deployment_site
    description: >-
      One row, a placeholder code — see the model header. Multi-site is no longer
      hypothetical: ichms.auth_customer already holds 울산 and 제주, and a person can hold
      both at once. This dim is not yet sourced from it because that table mixes deployment
      sites with application tenants (LIS, 아이콜리, iCHMS Web), and classifying them is an
      owner rule. See CLAUDE.md "Site affiliation is multi-valued".
    columns:
      - name: site_id
        data_tests: [not_null, unique]

  - name: dim_action
    description: App-action catalogue behind fct_app_action.
    columns:
      - name: action_no
        data_tests: [not_null, unique]

  - name: dim_device_type
    description: Measurement device types, labelled from ichms com_code (parent 20301300). Makes the cuff-vs-smartwatch density difference sliceable.
    columns:
      - name: device_type_code
        data_tests: [not_null, unique]
      - name: device_type_name_kor
        data_tests: [not_null]

  - name: fct_measurement
    description: >
      GRAIN: user × measured_at × metric. Discrete lifelog readings (BP, body
      composition, grip strength, glucose) in tall form. Continuous streams and
      interval aggregates are excluded — see the staging model header.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, measured_at, metric_code]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: measured_at
        data_tests: [not_null]
      - name: measured_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - systolic_bp
                  - diastolic_bp
                  - pulse
                  - weight
                  - height
                  - bmi
                  - skeletal_muscle_mass
                  - body_fat_mass
                  - body_fat_percentage
                  - grip_strength_left
                  - grip_strength_right
                  - blood_glucose
      - name: metric_value
        description: >
          Null readings are dropped in staging — an absent measurement is not a
          measurement of nothing. Glucose is normalised to mg/dL in staging
          (owner decision 2026-08-06); every other metric arrives in one unit.
        data_tests: [not_null]
      - name: metric_unit
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mmHg', 'bpm', 'kg', 'cm', 'kg/m2', '%', 'mg/dL']
      - name: device_type_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_device_type')
                field: device_type_code
              config:
                where: "device_type_id is not null"

  - name: fct_coaching_event
    description: >
      GRAIN: one JITAI activity delivery (activity_row_id). Delivery, response
      and latency. Non-completions and withdrawn activities are kept — they are
      the denominator of every adherence metric.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_row_id]
    columns:
      - name: activity_row_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_completed
        data_tests: [not_null]
      - name: response_latency_minutes
        description: Negative latency would mean a completion before delivery — a clock or ordering bug, not a fast user.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                where: "response_latency_minutes is not null"
                severity: warn

  - name: fct_app_action
    description: "GRAIN: one app action (action_log_no). The fact that needed the Q-10 key translation; done in staging."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [action_log_no]
    columns:
      - name: action_log_no
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: action_no
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_action')
                field: action_no
      - name: action_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_user_day
    description: >
      GRAIN: user × ymd, DENSE — every day from the user's joined_dt to the
      observation frontier, including days with no activity at all. Changed from
      the old sparse scoring-only spine on 2026-08-07 (5,747 rows = 9.3% of
      lived user-days); a behavioural panel needs the zero days because they are
      the denominator. has_irs_scores / has_intg_analysis still mark the
      scoring-day subset. Carries age_at_activity + age_band_5y (D-24/D-25,
      Q-12), relative time since join, and per-channel behaviour with
      active/passive separated.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date]
      # A completion can never exceed its delivery. This is the denominator
      # contract that DASHBOARD_METRIC_FEEDBACK §5.2 records being violated in
      # a published verdict — asserted here so it fails the build instead.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "routines_completed <= routines_delivered"
      # NOT tested: days_since_joined >= 0. The spine deliberately starts before
      # enrolment where a user was already active, so negative values are
      # correct and are what makes a pre-period available (§1.3). Asserting
      # non-negativity here is what silently dropped 381 meal records.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: age_at_activity
        description: Null only where birth_year is null (4 users); a rise here means the birth_year path broke.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.05}
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                where: "age_at_activity is not null"
      - name: age_band_5y
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                where: "age_band_5y is not null"
      - name: diseases_scored
        data_tests: [not_null]
      - name: has_intg_analysis
        data_tests: [not_null]
      - name: has_irs_scores
        data_tests: [not_null]

      - name: days_since_joined
        description: >
          Days since the user's joined_dt. Use this, not calendar date, when
          comparing trajectories — §2.1: enrolment spans nine months, so
          calendar time mixes cohort entry with behaviour change.
        data_tests: [not_null]
      - name: months_since_joined
        description: >
          Completed months since join (M0, M1, …). Censoring is NOT flagged per
          row because it is a property of an aggregate: high months contain only
          early registrants. Check the cell count before reading a trend.
        data_tests: [not_null]

      - name: app_login_events
        description: >
          THE dominant control variable, not one channel among several. §4.5:
          routine completion ~24% at 0–5 login days vs ~65–72% at 16+, and
          controlling for it reverses the sign of the premium-content effect.
          Condition on this before claiming any behavioural comparison.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: did_login
        data_tests: [not_null]
      - name: routines_delivered
        description: The denominator. What the engine offered, whether or not the user acted.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: routines_completed
        description: The numerator. Never compute a rate from this without routines_delivered in the same row.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: manual_measurements
        description: Discrete readings the user took deliberately — BP, body, bodyfat, grip, glucose. ACTIVE input.
        data_tests: [not_null]
      - name: meal_records
        description: >
          Surviving meal records from disc_lifelog_user_meal — the channel the
          dashboard previously reported as disc_lifelog_user_food (11 users)
          while the real one had 335. See C22 / §5.
        data_tests: [not_null]
      - name: wearable_streams_active
        description: >
          Distinct wearable streams that fired (0–5). Wear-day, not intensity:
          §1.1④ found 91.6% of holders at a perfect 30/30, because a worn watch
          collects passively. PASSIVE collection.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 5}
      - name: app_actions
        data_tests: [not_null]
      - name: active_input_events
        description: >
          manual_measurements + meal_records. Kept separate from passive
          collection (§2.3): active channels were cooling while the wearable
          sat at its ceiling, and one summed "engagement" number hides that.
        data_tests: [not_null]
      - name: had_passive_collection
        data_tests: [not_null]

  - name: fct_user_disease_day
    description: >
      GRAIN: user × ymd × disease. All five percentile-rank scores from the
      relational scoring history. is_in_catalog separates the 35 user-facing
      diseases from the 9 scored-only ones.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date, disease_id]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: disease_id
        description: >
          Relationship to dim_disease is asserted only for catalog diseases —
          the 9 scored-but-not-displayed ids have no dim row by design.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_disease')
                field: disease_id
              config:
                where: "is_in_catalog"
      - name: is_in_catalog
        data_tests: [not_null]
      # Scores are 1..100 percentile ranks. A value outside that range means the
      # engine changed its output contract.
      - name: irs_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
              config:
                where: "irs_score is not null"
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: irsp_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
              config:
                where: "irsp_score is not null"
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: lrs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: mrs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: prs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
