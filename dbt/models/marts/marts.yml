# Tests for the marts layer. The grain test on each fact is the contract that
# makes the rest survivable (D-04) — it is the one thing the cut order never
# touches. Relationship tests are the second half: they turn "this fact row has
# no dimension row" from a silently-dropped chart row into a build failure.

version: 2

models:
  - name: dim_user
    description: >
      SCD1 user dimension. Population = the current sibc cohort (N-02).
      is_mapped flags cohort members with no iccoli link so they keep their
      facts instead of being orphaned. No name, no DOB, no static age.
      Current site and lifetime behaviour are deliberately separated from this
      stable/current-profile relation.
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: birth_year
        description: Null when no approved birth-year source exists; age columns in facts remain null rather than guessing.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.05}
      - name: is_mapped
        data_tests: [not_null]
      - name: weight_kg
        description: >
          Enrolment-time weight (kg) from user_master. Zero upstream becomes
          null. Not a longitudinal series — those are in fct_measurement.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.02}
      - name: height_cm
        description: Enrolment-time height (cm). Zero upstream becomes null.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.02}
      - name: bmi
        description: weight_kg / (height_cm/100)^2. Null when either input is null.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.02}
      - name: bmi_band
        description: >
          Asia-Pacific cutoffs (underweight <18.5, normal <23, overweight <25,
          obese ≥25). Historical analysis found BMI non-monotonic and
          age-confounded; never interpret a BMI slice alone.
        data_tests:
          - accepted_values:
              arguments:
                values: [underweight, normal, overweight, obese]
              config:
                where: "bmi_band is not null"
      - name: cohort_group
        description: >
          staff | participant. From the staff_roster seed, not from behavioural
          traces. Contrast is "participation contract vs none", not an inferred
          behavioural distinction. The seed needs owner confirmation for new
          hires.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [staff, participant]

  - name: bridge_user_site_current
    description: >
      GRAIN: current cohort user × current approved site. Current-filter only;
      never use this bridge for event-time attribution because source updates
      erase the previous site and actual switch time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [user_id, current_site_id]}
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: current_site_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_deployment_site'), field: site_id}

  - name: dim_date
    description: Generated calendar, 2025-01-01 through the end of next year. Weeks start Monday (D-18).
    columns:
      - name: date_day
        data_tests: [not_null, unique]
      - name: week_start_date
        data_tests: [not_null]

  - name: dim_disease
    description: The 35 user-facing diseases with Korean + English labels. The 9 scored-but-not-displayed ids are deliberately absent.
    columns:
      - name: disease_id
        data_tests: [not_null, unique]
      - name: phenotype_kor
        data_tests: [not_null]

  - name: dim_deployment_site
    description: >
      Owner-approved Ulsan and Jeju deployment sites from ichms.auth_customer.
      Application-tenant customer rows are deliberately excluded by UUID.
    columns:
      - name: site_id
        data_tests: [not_null, unique]
      - name: site_name_kor
        data_tests: [not_null]
      - name: site_name_eng
        data_tests: [not_null]
      - name: country_code
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['KR']}

  - name: dim_action
    description: App-action catalogue behind fct_app_action.
    columns:
      - name: action_no
        data_tests: [not_null, unique]

  - name: dim_device_type
    description: Measurement device types, labelled from ichms com_code (parent 20301300). Makes the cuff-vs-smartwatch density difference sliceable.
    columns:
      - name: device_type_code
        data_tests: [not_null, unique]
      - name: device_type_name_kor
        data_tests: [not_null]

  - name: fct_measurement
    description: >
      GRAIN: user × source transaction × measured_at × metric. Device,
      platform, and location are retained; repeated user/time/metric slots are
      not collapsed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, source_stream, source_transaction_id, measured_at, metric_code]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: measured_at
        data_tests: [not_null]
      - name: source_stream
        data_tests: [not_null]
      - name: source_transaction_id
        data_tests: [not_null]
      - name: measured_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: metric_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - systolic_bp
                  - diastolic_bp
                  - pulse
                  - weight
                  - height
                  - bmi
                  - skeletal_muscle_mass
                  - body_fat_mass
                  - body_fat_percentage
                  - grip_strength_left
                  - grip_strength_right
                  - blood_glucose
      - name: metric_value
        description: >
          Null readings are dropped in staging — an absent measurement is not a
          measurement of nothing. Glucose is normalised to mg/dL in staging
          (owner decision 2026-08-06); every other metric arrives in one unit.
        data_tests: [not_null]
      - name: metric_unit
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mmHg', 'bpm', 'kg', 'cm', 'kg/m2', '%', 'mg/dL']
      - name: device_type_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_device_type')
                field: device_type_code
              config:
                where: "device_type_id is not null"

  - name: fct_wearable_day
    description: >
      GRAIN: user × day, sparse — only days any wearable stream fired. Daily
      step / sleep / activity / heart-rate / SpO2 intensity. NULL on a present
      row means that stream did not fire, not zero. Quote counts with extraction
      date (wearables backfill ~30 days).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: step_count
        description: Sum of step_cnt that day. NULL if the step stream did not fire.
      - name: sleep_hours
        description: >
          Sum of session durations dated from total_measure_start_dt (KST).
          Overnight sessions that span midnight sit on the start date.
      - name: heartrate_mean
        description: Mean of heartrate_cnt samples that day. NULL if HR did not fire.
      - name: spo2_mean
        description: Mean oxygen_saturation that day. NULL if SpO2 did not fire.

  - name: fct_wearable_step
    description: >
      GRAIN: one distinct source step observation. Exact duplicate payloads
      collapse, while source_row_count preserves their multiplicity.
    columns:
      - name: observation_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: measured_at
        data_tests: [not_null]
      - name: measured_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: device_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_device_type'), field: device_type_code}
              config: {where: "device_type_id is not null"}
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: fct_wearable_activity
    description: "GRAIN: one distinct source activity interval observation."
    columns:
      - name: observation_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: measured_at
        data_tests: [not_null]
      - name: measured_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: device_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_device_type'), field: device_type_code}
              config: {where: "device_type_id is not null"}
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: fct_wearable_heartrate
    description: >
      GRAIN: one distinct source heart-rate observation. Different values in the
      same timestamp/type slot remain separate observations. Built only for a
      named detail consumer; routine runs replace the latest 30 event-time days.
    columns:
      - name: observation_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: measured_at
        data_tests: [not_null]
      - name: measured_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: heartrate_count
        data_tests: [not_null]
      - name: device_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_device_type'), field: device_type_code}
              config: {where: "device_type_id is not null"}
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: fct_wearable_oxygen_saturation
    description: "GRAIN: one distinct source oxygen-saturation observation."
    columns:
      - name: observation_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: measured_at
        data_tests: [not_null]
      - name: measured_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: oxygen_saturation
        data_tests: [not_null]
      - name: device_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_device_type'), field: device_type_code}
              config: {where: "device_type_id is not null"}
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: fct_wearable_sleep
    description: >
      GRAIN: one distinct source sleep session. Sessions are dated from their
      KST start date, matching fct_wearable_day.
    columns:
      - name: observation_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: started_at
        data_tests: [not_null]
      - name: started_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: user_sleep_sn
        data_tests: [not_null, unique]
      - name: device_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_device_type'), field: device_type_code}
              config: {where: "device_type_id is not null"}
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: fct_wearable_sleep_stage
    description: >
      GRAIN: one distinct source sleep-stage interval, attributed through its
      sleep session. Includes all extracted sleep-detail observations.
    columns:
      - name: observation_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: started_at
        data_tests: [not_null]
      - name: started_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: sleep_stage_code
        data_tests: [not_null]
      - name: user_sleep_sn
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fct_wearable_sleep'), field: user_sleep_sn}
      - name: device_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_device_type'), field: device_type_code}
              config: {where: "device_type_id is not null"}
      - name: source_row_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: fct_coaching_event
    description: >
      GRAIN: one JITAI activity delivery (activity_row_id). Delivery, response
      and latency. Non-completions and withdrawn activities are kept — they are
      the denominator of every adherence metric.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_row_id]
    columns:
      - name: activity_row_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_completed
        data_tests: [not_null]
      - name: response_latency_minutes
        description: Negative latency would mean a completion before delivery — a clock or ordering bug, not a fast user.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                where: "response_latency_minutes is not null"
                severity: warn

  - name: fct_app_action
    description: "GRAIN: one app action (action_log_no). Its user key translation is completed in staging."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [action_log_no]
    columns:
      - name: action_log_no
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: action_no
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_action')
                field: action_no
      - name: action_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_app_login_event
    description: "GRAIN: one keyless-source login event at user × timestamp × channel."
    columns:
      - name: login_event_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: logged_in_at
        data_tests: [not_null]
      - name: login_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}

  - name: fct_app_search_event
    description: >
      GRAIN: one retained current-cohort search event per search_log_no. Search
      text never lands in this fact; display_yn is retained as neutral source
      state without filtering away an observed event.
    columns:
      - name: search_log_no
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: searched_at
        data_tests: [not_null]
      - name: search_date
        data_tests: [not_null]
      - name: source_display_yn
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['Y', 'N']}

  - name: fct_share_link
    description: >
      GRAIN: one retained current-cohort share link per share_no. This is link
      creation, not a recipient interaction. share_key and target_no are absent.
    columns:
      - name: share_no
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: share_type
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['EVENT', 'HOME', 'INVITE', 'POST', 'SURVEY']}
      - name: share_created_at
        data_tests: [not_null]
      - name: share_created_date
        data_tests: [not_null]

  - name: fct_share_interaction_event
    description: >
      GRAIN: one retained current-cohort neutral interaction per share_log_no.
      user_id is the source from_user actor, but this relation does not assert
      that the sender performed the downstream interaction or that it was an
      open/success event.
    columns:
      - name: share_log_no
        data_tests: [not_null, unique]
      - name: share_no
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_share_link')
                field: share_no
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: interaction_at
        data_tests: [not_null]
      - name: interaction_date
        data_tests: [not_null]
      - name: source_point_call_yn
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['Y', 'N']}

  - name: fct_meal_event
    description: "GRAIN: one meal record at source transaction × recorded timestamp."
    columns:
      - name: meal_event_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: source_transaction_id
        data_tests: [not_null]
      - name: recorded_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}

  - name: fct_user_intg_analysis_day
    description: "GRAIN: user × analysis day, with allow-listed signature fields only."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [user_id, ymd_date]}
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}

  - name: fct_channel_load_status
    description: >
      GRAIN: one channel. Conservative per-target success evidence; not a DAG
      completion ledger, because empty incremental runs are invisible today.
    columns:
      - name: channel_code
        data_tests: [not_null, unique]
      - name: dependency_count
        data_tests: [not_null]
      - name: successful_dependency_count
        data_tests: [not_null]
      - name: completion_evidence_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['TARGET_SUCCESS_ONLY']}

  - name: fct_user_milestone
    description: "GRAIN: user × first observed milestone; no fabricated timestamps or placeholder stages."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [user_id, milestone_code]}
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: milestone_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cohort_enrolled, iccoli_mapped, first_app_login, first_app_action, first_app_search, first_share_created, first_share_interaction, first_coaching_delivered, first_measurement]
      - name: occurred_date
        data_tests: [not_null]
      - name: temporal_precision
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [DATE, TIMESTAMP]}

  - name: fct_user_day
    description: >
      GRAIN: user × ymd, dense from the earlier of enrolment and first real
      activity through the observed/load frontier. Counts are zero only where
      channel load and user eligibility are established; otherwise they are
      NULL with an explicit state.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date]
      # A completion can never exceed its delivery. This is the denominator
      # contract whose historical violation motivated the dense-panel finding;
      # it is asserted here so a regression fails the build.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "routines_completed <= routines_delivered"
      # NOT tested: days_since_joined >= 0. The spine deliberately starts before
      # enrolment where a user was already active, so negative values are
      # correct and are what makes a pre-period available. Asserting
      # non-negativity here is what silently dropped 381 meal records.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: age_at_activity
        description: Null where birth_year is unavailable; never impute it silently.
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.05}
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                where: "age_at_activity is not null"
      - name: age_band_5y
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                where: "age_band_5y is not null"
      - name: diseases_scored
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
              config: {where: "diseases_scored is not null"}

      - name: days_since_joined
        description: >
          Days since the user's joined_dt. Use this, not calendar date, when
          comparing trajectories; calendar time mixes cohort entry with
          behaviour change when enrolment is staggered.
        data_tests: [not_null]
      - name: months_since_joined
        description: >
          Completed months since join (M0, M1, …). Censoring is NOT flagged per
          row because it is a property of an aggregate: high months contain only
          early registrants. Check the cell count before reading a trend.
        data_tests: [not_null]

      - name: app_login_events
        description: >
          Historical analysis found login activity to be a strong confounder.
          Use it as a control variable, but require registered semantics and
          model validation before making an effect claim.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
              config: {where: "app_login_events is not null"}
      - name: did_login
        description: NULL when login load or eligibility is not established.
      - name: routines_delivered
        description: The denominator. What the engine offered, whether or not the user acted.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
              config: {where: "routines_delivered is not null"}
      - name: routines_completed
        description: The numerator. Never compute a rate from this without routines_delivered in the same row.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
              config: {where: "routines_completed is not null"}
      - name: manual_measurements
        description: Discrete readings; NULL absence because device/channel eligibility is unsourced.
      - name: meal_records
        description: >
          Meal records from the canonical disc_lifelog_user_meal source. Do not
          substitute the similarly named food relation. NULL absence means
          eligibility is unknown, not zero meals.
      - name: wearable_streams_active
        description: >
          Distinct wearable streams that fired (0–5). This is a wear-day signal,
          not intensity, and represents passive collection. Quote population
          counts only with their extraction date.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 5}
              config: {where: "wearable_streams_active is not null"}
      - name: app_actions
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
              config: {where: "app_actions is not null"}
      - name: had_passive_collection
        description: TRUE only on observed wearable days; otherwise NULL because allocation is unknown.
      - name: app_login_state
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [OBSERVED_ACTIVITY, OBSERVED_ZERO, NOT_LOADED, NOT_YET_ELIGIBLE, ELIGIBILITY_UNKNOWN]}
      - name: measurement_state
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [OBSERVED_ACTIVITY, NOT_LOADED, ELIGIBILITY_UNKNOWN]}
      - name: share_interaction_events
        description: Neutral interaction count; excluded from sender app-engaged-day logic.

  - name: fct_user_day_wide
    description: >
      GRAIN: user × ymd convenience relation over the time-aware panel. It has
      no lifetime behaviour segmentation and no historical site attribution.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date]
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: ymd_date
        data_tests: [not_null]
      - name: sex
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.01}
      - name: bmi_band
        description: >
          Asia-Pacific band from dim_user. Null where height or weight is
          unavailable. Never interpret BMI slices alone.
        data_tests:
          - accepted_values:
              arguments:
                values: [underweight, normal, overweight, obese]
              config:
                where: "bmi_band is not null"
      - name: cohort_group
        description: >
          staff | participant from staff_roster. Contrast is participation
          contract vs none, not an inferred behavioural distinction.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [staff, participant]
      - name: week_start_date
        data_tests: [not_null]
      - name: months_since_joined
        data_tests: [not_null]
      - name: app_login_events
        description: Nullable where load or eligibility is not established.

  - name: fct_user_month
    description: >
      GRAIN: user × calendar month, with cohort-relative month index, explicit
      left partial/right censoring flags, and observed-day denominator pairs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [user_id, month_start_date]}
      - dbt_utils.expression_is_true:
          arguments: {expression: "routines_completed <= routines_delivered"}
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: month_start_date
        data_tests: [not_null]
      - name: cohort_month_index
        data_tests: [not_null]
      - name: panel_days
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 31}
      - name: is_left_partial_month
        data_tests: [not_null]
      - name: is_right_censored
        data_tests: [not_null]
      - name: remote_care_qualifying_days
        description: Intentionally NULL until an approved qualifying-day definition exists.
      - name: remote_care_qualifying_day_status
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [HYPOTHESIS_UNDEFINED]}

  - name: fct_user_disease_day
    description: >
      GRAIN: user × ymd × disease. All five percentile-rank scores from the
      relational scoring history. is_in_catalog separates the 35 user-facing
      diseases from the 9 scored-only ones.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, ymd_date, disease_id]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: ymd_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: disease_id
        description: >
          Relationship to dim_disease is asserted only for catalog diseases —
          the 9 scored-but-not-displayed ids have no dim row by design.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_disease')
                field: disease_id
              config:
                where: "is_in_catalog"
      - name: is_in_catalog
        data_tests: [not_null]
      # Scores are 1..100 percentile ranks. A value outside that range means the
      # engine changed its output contract.
      - name: irs_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
              config:
                where: "irs_score is not null"
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: irsp_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
              config:
                where: "irsp_score is not null"
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: lrs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: mrs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
      - name: prs_score
        data_tests:
          - null_rate_below:
              arguments: {max_null_rate: 0.35}
