version: 2

seeds:
  - name: jsonb_allowlist
    description: >
      D-26/D-27: the explicit allow-list of top-level JSONB keys in the sibc log
      payloads. This file is the contract: a key must be listed here to be KNOWN,
      and must have extract=true to be selected by a staging model. The payload is
      a moving target by design (모델/룰 변경으로 키 확장 가능) — when the drift
      test (jsonb_keys_in_allowlist) fails naming a new key, classify it, add a
      row here (extract=false unless a model needs it and it is identity-free),
      and re-run. Never add an identity key with extract=true.
    config:
      column_types:
        source_table: text
        payload_column: text
        jsonb_key: text
        extract: boolean
        note: text
    columns:
      - name: jsonb_key
        data_tests:
          - not_null

  - name: irs_disease_catalog
    description: >
      The 35 user-facing diseases, generated from
      `docs/01_product_specs/IRS-disease-catalog.csv` (source file is CRLF —
      strip it when regenerating, or every id gains a trailing \r and joins
      silently fail). disease_id is the English phenotype, which is what the
      scoring engine emits. Backs dim_disease.
    config:
      column_types:
        disease_id: text
        phenotype_kor: text
        phenotype_eng: text
    columns:
      - name: disease_id
        data_tests: [not_null, unique]

  - name: staff_roster
    description: >
      Owner-maintained list of internal-staff user_ids inside the analysis
      cohort. dim_user.cohort_group reads this seed — never derive staff from
      auth_user_customer re-points or other behavioural traces (CLAUDE.md
      2026-08-12). Bootstrapped 2026-08-13 from the §1 wellness-mission
      discriminator (sibc cohort members with no accrual under parent
      category 34, excluding the unused completion flag 41): 19 rows. That
      proxy is "participation contract vs none", not "voluntary vs
      involuntary" (DASHBOARD_METRIC_FEEDBACK §1.5). Add new hires here by
      hand; remove anyone confirmed not staff.
    config:
      column_types:
        user_id: text
        note: text
    columns:
      - name: user_id
        data_tests: [not_null, unique]
